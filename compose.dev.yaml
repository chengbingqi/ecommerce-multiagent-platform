services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./backend/app:/app/app:ro
      - ./backend/mcp_servers:/app/mcp_servers:ro
      - ./backend/scripts:/app/scripts:ro
      - ./data:/app/data:ro
      - ./secrets/development/session_secret:/run/secrets/dev_session_secret:ro
      - ./secrets/development/csrf_secret:/run/secrets/dev_csrf_secret:ro
      - ${DATA_ROOT:?Set DATA_ROOT to an external data directory}/temp:/data/temp
    environment:
      SESSION_SECRET_FILE: /run/secrets/dev_session_secret
      CSRF_SECRET_FILE: /run/secrets/dev_csrf_secret
      SESSION_COOKIE_NAME: __Host-ecom_local_session
      SECURE_SESSION_COOKIE: "true"
      ALLOWED_ORIGINS: https://localhost:8443,http://localhost:5173,http://127.0.0.1:5173
      PUBLIC_BASE_URL: https://localhost:8443
    ports:
      - "127.0.0.1:8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    image: ecommerce-multiagent-stage1-frontend-dev
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "127.0.0.1:5173:5173"

  edge:
    environment:
      PUBLIC_DOMAIN: localhost
    volumes:
      - ./deploy/Caddyfile.local:/etc/caddy/Caddyfile:ro
      - ./frontend/dist:/srv:ro
      - caddy_local_data:/data
      - caddy_local_config:/config
    ports:
      - "127.0.0.1:8080:80"
      - "127.0.0.1:8443:443"

  business-mcp:
    volumes:
      - ./backend/app:/app/app:ro
      - ./backend/mcp_servers:/app/mcp_servers:ro
      - ./backend/scripts:/app/scripts:ro
      - ./data:/app/data:ro
      - ./migrations:/app/migrations:ro
      - ./tests:/app/tests:ro

  knowledge-mcp:
    volumes:
      - ./backend/app:/app/app:ro
      - ./backend/mcp_servers:/app/mcp_servers:ro

  media-mcp:
    volumes:
      - ./backend/app:/app/app:ro
      - ./backend/mcp_servers:/app/mcp_servers:ro

  worker-media:
    volumes:
      - ./backend/app:/app/app:ro
      - ./backend/mcp_servers:/app/mcp_servers:ro
      - ./backend/scripts:/app/scripts:ro
      - ${DATA_ROOT:?Set DATA_ROOT to an external data directory}/temp:/data/temp
      - ${DATA_ROOT:?Set DATA_ROOT to an external data directory}/models/asr/large-v3-edaa852ec7e145841d8ffdb056a99866b5f0a478:/data/models/asr/large-v3-edaa852ec7e145841d8ffdb056a99866b5f0a478:ro

volumes:
  frontend_node_modules:
  caddy_local_data:
  caddy_local_config:

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecommerce-multiagent-api"
version = "0.1.0"
description = "Stage 5 multi-agent API and controlled media pipeline"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "argon2-cffi>=25,<26",
  "asyncpg>=0.30,<1",
  "fastapi==0.139.2",
  "httpx>=0.28,<0.29",
  "pydantic-settings>=2.7,<3",
  "redis>=5.2,<7",
  "sqlalchemy[asyncio]>=2.0,<3",
  "sse-starlette==3.0.3",
  "starlette==1.3.1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.20,<1",
  "mypy>=1.14,<2",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.4,<2",
  "ruff>=0.9,<1",
  "langchain-core==1.4.9",
  "langgraph==1.2.9",
  "langgraph-checkpoint-postgres==3.1.0",
  "mcp==1.28.1",
  "psycopg[binary,pool]==3.3.4",
]
stage2 = ["mcp==1.28.1"]
stage3 = [
  "langchain-core==1.4.9",
  "langgraph==1.2.9",
  "langgraph-checkpoint-postgres==3.1.0",
  "mcp==1.28.1",
  "psycopg[binary,pool]==3.3.4",
]
stage5 = [
  "aiofiles==24.1.0",
  "celery==5.5.3",
  "langchain-core==1.4.9",
  "langgraph==1.2.9",
  "langgraph-checkpoint-postgres==3.1.0",
  "mcp==1.28.1",
  "minio==7.2.18",
  "psycopg[binary,pool]==3.3.4",
]
stage5-worker = [
  "aiofiles==24.1.0",
  "celery==5.5.3",
  "faster-whisper==1.1.1",
  "minio==7.2.18",
  "nvidia-cublas-cu12==12.3.4.1",
  "nvidia-cudnn-cu12==9.1.1.17",
  "psycopg[binary,pool]==3.3.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "mcp_servers*"]

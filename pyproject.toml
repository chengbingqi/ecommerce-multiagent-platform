[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
addopts = "-q --import-mode=importlib"
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["backend/tests", "tests"]
markers = [
  "live_llm: controlled DeepSeek API smoke tests, disabled unless explicitly enabled",
  "container_acceptance: Stage 3 local Compose restart and PostgreSQL checkpoint acceptance",
]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
files = ["backend/app", "backend/mcp_servers"]
